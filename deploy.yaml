apiVersion: apps/v1
kind: Deployment
metadata:
  name: turing-site
  namespace: devops-web
  labels:
    app: turing-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: turing-site
  template:
    metadata:
      labels:
        app: turing-site
    spec:
      containers:
      - name: turing-site
        image: 172.20.147.120:8081/wolfcode/turing-site:1.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          requests: {memory: 64Mi, cpu: 50m}
          limits: {memory: 128Mi, cpu: 200m}
        readinessProbe:
          httpGet: {path: /, port: 3000}
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          httpGet: {path: /, port: 3000}
          initialDelaySeconds: 10
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: turing-site
  namespace: devops-web
spec:
  type: NodePort
  selector:
    app: turing-site
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30092
